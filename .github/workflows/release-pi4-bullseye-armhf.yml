name: Release Pi4 Bullseye (armhf)

on:
  push:
    tags:
      - 'v*-pi4-bullseye-armhf'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PRIVATE_REPO: AutomataNexus/Talos

jobs:
  build-pi4-bullseye-armhf:
    name: Build pi4-bullseye-armhf
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye
    steps:
      - name: Install build dependencies
        run: |
          dpkg --add-architecture armhf
          apt-get update -qq
          apt-get install -y -qq curl build-essential pkg-config git ca-certificates
          apt-get install -y -qq libssl-dev
          apt-get install -y -qq gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          apt-get install -y -qq libssl-dev:armhf || true

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup target add armv7-unknown-linux-gnueabihf

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PROJECTOPERATIONS }}

      - name: Override cargo config
        run: |
          mkdir -p hardware_daemon/.cargo
          cat > hardware_daemon/.cargo/config.toml << 'CFGEOF'
          [target.armv7-unknown-linux-gnueabihf]
          linker = "arm-linux-gnueabihf-gcc"
          CFGEOF

      - name: Build release binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig
          export OPENSSL_DIR=/usr
          export OPENSSL_LIB_DIR=/usr/lib/arm-linux-gnueabihf
          export OPENSSL_INCLUDE_DIR=/usr/include
          cd hardware_daemon && cargo build --release -p nexusedge-talos-daemon --target armv7-unknown-linux-gnueabihf

      - name: Package binary
        run: |
          mkdir -p release
          cp hardware_daemon/target/armv7-unknown-linux-gnueabihf/release/nexusedge-talos-daemon release/
          arm-linux-gnueabihf-strip release/nexusedge-talos-daemon || true
          cd release
          tar czf nexusedge-talos-daemon-pi4-bullseye-armhf.tar.gz nexusedge-talos-daemon
          sha256sum nexusedge-talos-daemon-pi4-bullseye-armhf.tar.gz > nexusedge-talos-daemon-pi4-bullseye-armhf.tar.gz.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/nexusedge-talos-daemon-pi4-bullseye-armhf.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/nexusedge-talos-daemon-pi4-bullseye-armhf.tar.gz
            release/nexusedge-talos-daemon-pi4-bullseye-armhf.tar.gz.sha256
          tag_name: ${{ github.ref_name }}
          name: "Talos Daemon Pi4 Bullseye armhf — ${{ github.ref_name }}"
          body: |
            Talos I2C hardware daemon for Pi 4 running 32-bit Raspbian Bullseye (armhf).
            SLSA Build L3 attested.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
